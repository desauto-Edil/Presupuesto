{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/imperandina.css' %}" rel="stylesheet">
    <style>
        body { background: var(--surface); display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-brand { background: var(--brand-violet); color: white; border: none; width: 100%; padding: 0.8rem; }
    </style>
</head>
<body class="theme-imperandina">
    <div class="login-card fade-up">
        <h3 class="text-center mb-4" style="color: var(--brand-violet); font-family: 'Syne';">Andicost Login</h3>
        
        {% if messages %}
            {% for m in messages %}<div class="alert alert-danger small">{{ m }}</div>{% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-brand">Entrar al Sistema</button>
        </form>
    </div>
</body>
</html>

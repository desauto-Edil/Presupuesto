{% extends "base.html" %}
{% block title %}Eliminar usuario{% endblock %}
{% block content %}
<h2>Eliminar usuario</h2>
<div class="alert alert-danger">
    Esta accion eliminara al usuario <strong>{{ object.nombre_completo }}</strong> permanentemente.
</div>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirmar eliminacion</button>
    <a href="{% url 'usuarios:usuario_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}

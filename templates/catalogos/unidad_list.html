{% extends "base.html" %}
{% block title %}Unidades de medida{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Unidades de medida</h2>
    <a href="{% url 'catalogos:unidad_create' %}" class="btn btn-primary">Crear</a>
</div>
<table class="table table-bordered bg-white">
    <thead class="table-dark"><tr><th>Codigo</th><th>Nombre</th><th>Abrev.</th><th>Acciones</th></tr></thead>
    <tbody>
    {% for u in unidades %}
    <tr>
        <td>{{ u.codigo }}</td><td>{{ u.nombre }}</td><td>{{ u.abreviatura }}</td>
        <td>
            <a href="{% url 'catalogos:unidad_update' u.pk %}" class="btn btn-sm btn-outline-secondary">Editar</a>
            <a href="{% url 'catalogos:unidad_delete' u.pk %}" class="btn btn-sm btn-outline-danger">Eliminar</a>
        </td>
    </tr>
    {% empty %}<tr><td colspan="4" class="text-center text-muted">Sin registros.</td></tr>{% endfor %}
    </tbody>
</table>
{% endblock %}

{% extends "base.html" %}
{% block title %}Confirmar eliminacion{% endblock %}
{% block content %}
<h2>Confirmar eliminacion</h2>
<div class="alert alert-danger">
    Esta accion eliminara el registro <strong>{{ object }}</strong> permanentemente.
</div>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirmar</button>
    <a href="javascript:history.back()" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}

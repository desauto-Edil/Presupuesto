<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="40" x2="320" y2="40"/>
    <line x1="0" y1="80" x2="320" y2="80"/>
    <line x1="0" y1="120" x2="320" y2="120"/>
    <line x1="80" y1="0" x2="80" y2="160"/>
    <line x1="160" y1="0" x2="160" y2="160"/>
    <line x1="240" y1="0" x2="240" y2="160"/>
  </g>
  <!-- Box icon -->
  <rect x="132" y="48" width="56" height="44" rx="6" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <line x1="132" y1="64" x2="188" y2="64" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <line x1="160" y1="48" x2="160" y2="64" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <!-- Label -->
  <rect x="108" y="108" width="104" height="18" rx="4" fill="rgba(255,255,255,0.06)"/>
  <text x="160" y="121" text-anchor="middle" font-family="Arial, sans-serif"
    font-size="11" fill="rgba(255,255,255,0.35)" letter-spacing="2">CATEGORÍA</text>
</svg>
